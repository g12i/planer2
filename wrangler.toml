# Used by @sveltejs/adapter-cloudflare during `vite build` (do not set main to src/cloudflare-entry.ts).
# Deploy with: pnpm deploy:cf  (uses wrangler.deploy.toml)
name = "planer2"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
